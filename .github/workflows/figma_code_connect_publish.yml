name: Publish Figma Code Connect

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: "main"

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            - name: Install dependencies
              run: npm ci

            - name: Publish Code Connect mappings to Figma
              run: npm run figma:publish
              env:
                  FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
